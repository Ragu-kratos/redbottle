<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance -- RedBottle Institute</title>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900" data-auth-pending>
    <div class="min-h-screen">
      <app-header></app-header>
      <main class="mx-auto grid max-w-3xl gap-6 px-4 py-6">
        <section class="card">
          <h2 class="section-title mb-3">Mark attendance</h2>

          <!-- The controls and the register are deliberately NOT one <form>.
               The register is swapped in by htmx, and one element cannot carry
               both the hx-get that loads it and the hx-post that saves it -- so
               the controls own the GET (on change) and the Save button owns the
               POST, each naming what to include. -->
          <div
            id="attendance-controls"
            hx-get="%VITE_FN_BASE%/api-attendance/roster"
            hx-trigger="change"
            hx-include="#attendance-controls"
            hx-target="#roster-slot"
            hx-swap="innerHTML"
            hx-indicator="#attendance-spinner"
            class="sm:grid sm:grid-cols-2 sm:gap-x-4"
          >
            <label class="field">
              <span>Batch</span>
              <!-- This <select> has its own hx-get, so it loads its options
                   independently of the change-triggered roster request on its
                   parent. Its own hx-target keeps that swap local. -->
              <select
                class="control"
                name="batchId"
                required
                hx-get="%VITE_FN_BASE%/api-options/batches"
                hx-trigger="load"
                hx-target="this"
                hx-swap="innerHTML"
              ></select>
            </label>

            <label class="field">
              <span>Date</span>
              <!-- Prefilled with today by the entry script (prefillDates), so
                   picking a batch is enough to load today's register. -->
              <input class="control" name="date" type="date" required />
            </label>
          </div>

          <!-- Spinner outside #roster-slot, or the first swap destroys it. -->
          <p id="attendance-spinner" class="htmx-indicator text-sm text-slate-400">Loading…</p>

          <div id="roster-slot" class="mt-1">
            <p class="rounded border border-slate-200 bg-white p-3 text-sm text-slate-500">
              Pick a batch to load its register for the chosen date.
            </p>
          </div>

          <div class="mt-3">
            <!-- Includes both the controls (batchId + date) and the swapped-in
                 checkboxes. An unchecked box posts nothing at all, which is why
                 the server re-reads the batch roster and treats every student
                 missing from the body as absent. -->
            <ui-button
              variant="primary"
              data-needs-net
              hx-post="%VITE_FN_BASE%/api-attendance/roster"
              hx-include="#attendance-controls, #roster-slot"
              hx-target="#roster-slot"
              hx-swap="innerHTML"
              hx-indicator="#attendance-spinner"
            >
              Save attendance
            </ui-button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/entries/attendance.js"></script>
  </body>
</html>
