<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courses -- RedBottle Institute</title>
    <!-- Render-blocking on purpose. Imported from JS, the stylesheet only
         arrived after Vite resolved the module graph, so dev's first paint had
         no CSS at all -- including the [data-auth-pending] gate, which meant raw
         unstyled markup was briefly visible. -->
    <link rel="stylesheet" href="/src/styles/index.css" />
    <!-- Applies a stored theme choice before first paint. Inline and synchronous
         on purpose: setting this from a module would paint the light palette and
         then repaint dark. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen" data-auth-pending>
    <div class="nav-progress" aria-hidden="true"></div>
    <app-sidebar></app-sidebar>
    <div class="lg:pl-60">
      <app-topbar></app-topbar>
      <!-- The boosted swap target. Nav links carry hx-select="#page" +
           hx-swap="outerHTML", so a screen change replaces exactly this element
           and the shell above is never redrawn. -->
      <main id="page" class="mx-auto grid max-w-4xl gap-5 px-4 py-6 sm:px-6">
        <section class="card card-pad">
          <h2 class="section-title">Add a course</h2>
          <p class="section-hint">A course is what you sell. A batch is one running instance of it.</p>
          <form
            id="course-form"
            class="mt-4 sm:grid sm:grid-cols-2 sm:gap-x-4"
            data-toast="Course added"
            hx-post="%VITE_FN_BASE%/api-courses/courses"
            hx-target="#courses-slot"
            hx-swap="innerHTML"
            hx-indicator="#courses-spinner"
          >
            <label class="field">
              <span>Course name</span>
              <input class="control" name="title" required maxlength="120" placeholder="MERN Full Stack Development" />
            </label>

            <label class="field">
              <span>Category</span>
              <!-- Options come from the server (endpoints/default/options.js) so a
                   <select>'s values can never drift from the model's enum.
                   hx-target="this" replaces this element's own children. -->
              <select
                class="control"
                name="category"
                required
                hx-get="%VITE_FN_BASE%/api-options/courseCategories"
                hx-trigger="load"
                hx-target="this"
                hx-swap="innerHTML"
              ></select>
            </label>

            <label class="field">
              <span>Duration</span>
              <input class="control num" name="durationWeeks" type="number" min="1" max="260" required placeholder="24" />
              <span class="field-hint">In weeks.</span>
            </label>

            <label class="field">
              <span>Fee</span>
              <input class="control num" name="feeAmount" type="number" min="0" step="1" required placeholder="65000" />
              <span class="field-hint">Whole rupees. This becomes the default agreed fee at enrolment.</span>
            </label>

            <label class="field sm:col-span-2">
              <span>Description</span>
              <textarea class="control" name="description" rows="2" maxlength="600" placeholder="What the course covers, in a line or two."></textarea>
              <span class="field-hint">Optional.</span>
            </label>

            <div class="sm:col-span-2 mt-1">
              <ui-button variant="primary" type="submit" data-needs-net>Add course</ui-button>
            </div>
          </form>
        </section>

        <section>
          <div class="mb-3 flex items-start justify-between gap-3">
            <div>
              <h2 class="section-title">Course catalogue</h2>
              
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <span id="courses-spinner" class="htmx-indicator text-xs text-muted-foreground"
                >Updating…</span
              >
              <ui-button
                size="xs"
                variant="ghost"
                data-needs-net
                data-api="courses"
                hx-target="#courses-slot"
                hx-swap="innerHTML"
                hx-indicator="#courses-spinner"
                >Refresh</ui-button
              >
            </div>
          </div>
          <div
            id="courses-slot"
            hx-get="%VITE_FN_BASE%/api-courses/courses"
            hx-trigger="load, refresh from:body"
            hx-swap="innerHTML"
            hx-indicator="#courses-spinner"
          >
            <ui-skeleton rows="3"></ui-skeleton>
          </div>
        </section>
      </main>
    </div>
    <ui-toasts></ui-toasts>
    <script type="module" src="/src/entries/courses.js"></script>
  </body>
</html>
