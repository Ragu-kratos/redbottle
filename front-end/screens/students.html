<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Students -- RedBottle Institute</title>
    <!-- Render-blocking on purpose. Imported from JS, the stylesheet only
         arrived after Vite resolved the module graph, so dev's first paint had
         no CSS at all -- including the [data-auth-pending] gate, which meant raw
         unstyled markup was briefly visible. -->
    <link rel="stylesheet" href="/src/styles/index.css" />
    <!-- Applies a stored theme choice before first paint. Inline and synchronous
         on purpose: setting this from a module would paint the light palette and
         then repaint dark. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-screen" data-auth-pending>
    <div class="nav-progress" aria-hidden="true"></div>
    <app-sidebar></app-sidebar>
    <div class="lg:pl-60">
      <app-topbar></app-topbar>
      <!-- The boosted swap target. Nav links carry hx-select="#page" +
           hx-swap="outerHTML", so a screen change replaces exactly this element
           and the shell above is never redrawn. -->
      <main id="page" class="mx-auto grid max-w-4xl gap-5 px-4 py-6 sm:px-6">
        <section class="card card-pad">
          <h2 class="section-title">Enrol a student</h2>
          <p class="section-hint">The batch must belong to the selected course and have a free seat. The server checks both and says which one failed.</p>
          <form
            id="student-form"
            class="mt-4 sm:grid sm:grid-cols-2 sm:gap-x-4"
            data-toast="Student enrolled"
            hx-post="%VITE_FN_BASE%/api-students/students"
            hx-target="#students-slot"
            hx-swap="innerHTML"
            hx-indicator="#students-spinner"
          >
            <label class="field">
              <span>Student name</span>
              <input class="control" name="name" required maxlength="120" placeholder="Ravi Kumar" />
            </label>

            <label class="field">
              <span>Phone</span>
              <input class="control num" name="phone" required maxlength="24" placeholder="+91 90000 10001" />
            </label>

            <label class="field">
              <span>Email</span>
              <input class="control" name="email" type="email" maxlength="160" placeholder="ravi@example.com" />
              <span class="field-hint">Optional.</span>
            </label>

            <label class="field">
              <span>Course</span>
              <!-- Options come from the server (endpoints/default/options.js) so a
                   <select>'s values can never drift from the model's enum.
                   hx-target="this" replaces this element's own children. -->
              <select
                class="control"
                name="courseId"
                required
                hx-get="%VITE_FN_BASE%/api-options/courses"
                hx-trigger="load"
                hx-target="this"
                hx-swap="innerHTML"
              ></select>
            </label>

            <label class="field">
              <span>Batch</span>
              <!-- Options come from the server (endpoints/default/options.js) so a
                   <select>'s values can never drift from the model's enum.
                   hx-target="this" replaces this element's own children. -->
              <select
                class="control"
                name="batchId"
                required
                hx-get="%VITE_FN_BASE%/api-options/batches"
                hx-trigger="load"
                hx-target="this"
                hx-swap="innerHTML"
              ></select>
              <span class="field-hint">Must belong to the course above.</span>
            </label>

            <label class="field">
              <span>Status</span>
              <!-- Options come from the server (endpoints/default/options.js) so a
                   <select>'s values can never drift from the model's enum.
                   hx-target="this" replaces this element's own children. -->
              <select
                class="control"
                name="status"
                required
                hx-get="%VITE_FN_BASE%/api-options/studentStatuses"
                hx-trigger="load"
                hx-target="this"
                hx-swap="innerHTML"
              ></select>
            </label>

            <label class="field">
              <span>Enrolment date</span>
              <input class="control" name="enrolledOn" type="date" required />
            </label>

            <label class="field">
              <span>Agreed fee</span>
              <input class="control num" name="totalFee" type="number" min="0" step="1" placeholder="65000" />
              <span class="field-hint">Leave blank to charge the course price.</span>
            </label>

            <label class="field sm:col-span-2">
              <span>Notes</span>
              <textarea class="control" name="notes" rows="2" maxlength="600" placeholder="Paying in three instalments."></textarea>
              <span class="field-hint">Optional.</span>
            </label>

            <div class="sm:col-span-2 mt-1">
              <ui-button variant="primary" type="submit" data-needs-net>Enrol student</ui-button>
            </div>
          </form>
        </section>

        <section>
          <div class="mb-3 flex items-start justify-between gap-3">
            <div>
              <h2 class="section-title">Students</h2>
              <p class="section-hint">Per-student dues are on the <a class="underline underline-offset-2" href="/fees">fees</a> screen, where they can be aggregated exactly for one student.</p>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <span id="students-spinner" class="htmx-indicator text-xs text-muted-foreground"
                >Updating…</span
              >
              <ui-button
                size="xs"
                variant="ghost"
                data-needs-net
                data-api="students"
                hx-target="#students-slot"
                hx-swap="innerHTML"
                hx-indicator="#students-spinner"
                >Refresh</ui-button
              >
            </div>
          </div>
          <div
            id="students-slot"
            hx-get="%VITE_FN_BASE%/api-students/students"
            hx-trigger="load, refresh from:body"
            hx-swap="innerHTML"
            hx-indicator="#students-spinner"
          >
            <ui-skeleton rows="3"></ui-skeleton>
          </div>
        </section>
      </main>
    </div>
    <ui-toasts></ui-toasts>
    <script type="module" src="/src/entries/students.js"></script>
  </body>
</html>
